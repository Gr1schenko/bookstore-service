openapi: 3.0.3
info:
  title: Bookstore API
  description: API for managing books, customers and orders
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/books:
    get:
      summary: Get all books
      operationId: getAllBooks
      tags:
        - Book
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookDto'

  /api/customers:
    get:
      summary: Get all customers
      operationId: getAllCustomers
      tags:
        - Customer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerDto'

  /api/customers/with-orders:
    get:
      summary: Get all customers with their orders
      operationId: getAllCustomersWithOrders
      tags:
        - Customer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerWithOrders'

  /api/orders:
    get:
      summary: Get all orders
      operationId: getAllCustomerOrders
      tags:
        - CustomerOrder
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOrderDto'

    post:
      summary: Create a new order
      operationId: createCustomerOrder
      tags:
        - CustomerOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerOrderDto'
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderDto'

components:
  schemas:
    BookDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isbn:
          type: string
        title:
          type: string
        authorFirstName:
          type: string
        authorLastName:
          type: string
        authorMiddleName:
          type: string
          nullable: true
        publisher:
          type: string
        publicationYear:
          type: integer
        pages:
          type: integer
        genre:
          type: string
          nullable: true
        price:
          type: number
          format: double
        stock:
          type: integer
        description:
          type: string
          nullable: true

    CustomerDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date

    CustomerOrderSummaryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderDate:
          type: string
          format: date
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED]
        totalAmount:
          type: number
          format: double

    CustomerWithOrders:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/CustomerDto'
        customerOrders:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOrderSummaryDto'

    OrderItemDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        book:
          $ref: '#/components/schemas/BookDto'
        quantity:
          type: integer
        priceAtOrder:
          type: number
          format: double

    CustomerOrderDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderDate:
          type: string
          format: date
        status:
          type: string
          enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED]
        totalAmount:
          type: number
          format: double
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'

    CreateOrderItemsDto:
      type: object
      required:
        - bookId
        - quantity
      properties:
        bookId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    CreateCustomerOrderDto:
      type: object
      required:
        - customerId
        - orderItems
      properties:
        customerId:
          type: integer
          format: int64
        orderItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemsDto'

tags:
  - name: Book
    description: Operations with books
  - name: Customer
    description: Operations with customers
  - name: CustomerOrder
    description: Operations with orders