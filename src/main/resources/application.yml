spring:
  application:
    name: bookstore

  datasource:
    url: jdbc:postgresql://localhost:5432/bookstore
    username: admin
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db_changelog_master.xml

logging:
  level:
    org.example.bookstore.service: DEBUG

discount:
  time-based:
    start-hour: 15
    end-hour: 16
    rate: 0.5
  wholesale:
    threshold: 5
    rate: 0.1

server:
  port: 8080
